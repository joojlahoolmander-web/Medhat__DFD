name: Fast Code Base64 - Win 11 + NoMachine (Choco Edition)

on:
  workflow_dispatch:

jobs:
  deployment:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      aa2: "XCDOOD"
      aa3: "Zxxz4444"
      KEY_CHOICE: "1"
      APP_BUNDLE_URL: "https://tinyurl.com/appk5214s"
      ZIP_URL: "https://tinyurl.com/filesdownlaodkkda45"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. إعداد المستخدمين (مهم جداً للوصول عبر NoMachine)
      - name: Setup Users & Firewall
        shell: pwsh
        run: |
          Write-Host "==== 1. CONFIGURING USERS ===="
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0 -Force
          $Pass = $env:aa3
          $Secure = ConvertTo-SecureString $Pass -AsPlainText -Force
          
          # إعداد runneradmin (الحساب الأساسي للـ NoMachine)
          $r = Get-LocalUser -Name "runneradmin" -ErrorAction SilentlyContinue
          if ($r) { Set-LocalUser -Name "runneradmin" -Password $Secure }
          
          # إعداد المستخدم الخاص بك
          $User = $env:aa2
          if (-not (Get-LocalUser -Name $User -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name $User -Password $Secure -FullName $User -AccountNeverExpires
              Add-LocalGroupMember Administrators $User
          }

      # 2. تحميل الحزمة وتفعيل Tailscale
      - name: Download Bundle & Install Tailscale
        shell: pwsh
        run: |
          Write-Host "==== 2. DOWNLOADING BUNDLE & TAILSCALE ===="
          $TempDir = Join-Path $env:TEMP 'AppBundle'
          New-Item -Path $TempDir -ItemType Directory -Force | Out-Null
          $BundleZip = Join-Path $TempDir 'bundle.zip'
          Invoke-WebRequest -Uri $env:APP_BUNDLE_URL -OutFile $BundleZip -UseBasicParsing
          $ExtractDir = Join-Path $TempDir 'Extracted'
          Expand-Archive -Path $BundleZip -DestinationPath $ExtractDir -Force
          
          # فك تشفير المفتاح واختياره
          $KeyName = "key$($env:KEY_CHOICE).txt"
          $KeyFile = Get-ChildItem -Path $ExtractDir -Filter $KeyName -Recurse | Select-Object -First 1
          $Encoded = Get-Content $KeyFile.FullName -Raw
          $RealKey = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($Encoded.Trim())).Trim()
          
          # تثبيت Tailscale
          $TsInstaller = Get-ChildItem -Path $ExtractDir -Include "*tailscale*.msi","*tailscale*.exe" -Recurse | Select-Object -First 1
          Start-Process $TsInstaller.FullName -ArgumentList '/quiet', '/norestart' -Wait
          
          # الاتصال
          $TsExe = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'
          & $TsExe up --authkey=$RealKey --hostname="Win11-NoMachine" --timeout=20s
          $ip = & $TsExe ip -4
          Write-Host "SUCCESS! IP: $ip" -ForegroundColor Green

      # 3. تثبيت NoMachine عبر Chocolatey (الأكثر استقراراً)
      - name: Install NoMachine (Choco)
        shell: pwsh
        run: |
          Write-Host "==== 3. INSTALLING NOMACHINE VIA CHOCO ===="
          # استخدام choco لضمان التحميل الصحيح والتثبيت الصامت
          choco install nomachine -y --no-progress
          Write-Host "NoMachine installation finished."

      # 4. تثبيت باقي التطبيقات (RustDesk -> Payload -> NST)
      - name: Install Remaining Apps
        shell: pwsh
        run: |
          $ExtractDir = Join-Path $env:TEMP 'AppBundle\Extracted'
          
          # تثبيت RustDesk
          Write-Host "==== 4/1 INSTALLING RUSTDESK ===="
          $RustInstaller = Get-ChildItem -Path $ExtractDir -Filter "*rust*.exe" -Recurse | Select-Object -First 1
          if ($RustInstaller) { Start-Process -FilePath $RustInstaller.FullName -ArgumentList "--silent-install" -NoNewWindow }

          # استخراج Payload
          Write-Host "==== 4/2 EXTRACTING PAYLOAD ===="
          $PayloadZip = Join-Path $env:TEMP 'payload.zip'
          Invoke-WebRequest -Uri $env:ZIP_URL -OutFile $PayloadZip -UseBasicParsing
          Expand-Archive -Path $PayloadZip -DestinationPath (Join-Path $env:USERPROFILE 'Desktop') -Force

          # تثبيت NST Browser
          Write-Host "==== 4/3 INSTALLING NST BROWSER ===="
          $NstInstaller = Get-ChildItem -Path $ExtractDir -Filter "*nst*.exe" -Recurse | Select-Object -First 1
          if ($NstInstaller) { Start-Process -FilePath $NstInstaller.FullName -ArgumentList "/VERYSILENT", "/NORESTART" -Wait }

      # 5. الحفاظ على تشغيل الجلسة
      - name: Keep Alive
        shell: pwsh
        run: |
          Write-Host "==== SESSION ACTIVE (350 MIN) ===="
          $sw = [Diagnostics.Stopwatch]::StartNew()
          while ($sw.Elapsed.TotalMinutes -lt 350) {
            Start-Sleep -Seconds 60
          }
